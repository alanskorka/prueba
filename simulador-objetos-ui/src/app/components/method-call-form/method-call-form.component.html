<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h2 class="mb-0">{{ isEdit ? 'Editar Llamada a Método' : 'Nueva Llamada a Método' }}</h2>
        </div>
        <div class="card-body">
          <div *ngIf="successMessage" class="alert alert-success">
            <i class="bi bi-check-circle"></i> {{ successMessage }}
          </div>
          <div *ngIf="errorMessage" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle"></i> {{ errorMessage }}
          </div>

          <div *ngIf="loading" class="text-center my-4">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2">Cargando métodos disponibles...</p>
          </div>

          <form *ngIf="!loading" [formGroup]="callForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="methodName" class="form-label">Nombre del Método</label>
              <input 
                type="text" 
                class="form-control" 
                id="methodName" 
                formControlName="methodName" 
                [ngClass]="{'is-invalid': callForm.get('methodName')?.invalid && callForm.get('methodName')?.touched}"
                placeholder="Ej: CalculateTotal"
                required
              >
              <div class="invalid-feedback" *ngIf="callForm.get('methodName')?.invalid && callForm.get('methodName')?.touched">
                El nombre del método es requerido
              </div>
            </div>
            <div class="mb-3">
              <label for="referenceType" class="form-label">Tipo de Referencia</label>
              <select 
                class="form-select" 
                id="referenceType" 
                formControlName="referenceType" 
                [ngClass]="{'is-invalid': callForm.get('referenceType')?.invalid && callForm.get('referenceType')?.touched}"
                required
              >
                <option value="This">This</option>
                <option value="Base">Base</option>
                <option value="Attribute">Attribute</option>
                <option value="Parameter">Parameter</option>
                <option value="LocalVar">LocalVar</option>
              </select>
              <div class="invalid-feedback" *ngIf="callForm.get('referenceType')?.invalid && callForm.get('referenceType')?.touched">
                El tipo de referencia es requerido
              </div>
            </div>
            <div class="mb-3">
              <label for="referenceName" class="form-label">Nombre de Referencia</label>
              <input 
                type="text" 
                class="form-control" 
                id="referenceName" 
                formControlName="referenceName" 
                placeholder="Ej: calculator, result"
              >
            </div>
            <div class="mb-3">
              <label for="parentMethodId" class="form-label">Método Padre</label>
              <select 
                class="form-select" 
                id="parentMethodId" 
                formControlName="parentMethodId" 
                [ngClass]="{'is-invalid': callForm.get('parentMethodId')?.invalid && callForm.get('parentMethodId')?.touched}"
                required
              >
                <option value="">Seleccione un método padre</option>
                <option *ngFor="let m of methods" [value]="m.id">{{ m.name }} ({{ m.returnType }})</option>
              </select>
              <div class="invalid-feedback" *ngIf="callForm.get('parentMethodId')?.invalid && callForm.get('parentMethodId')?.touched">
                El método padre es requerido
              </div>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button type="submit" class="btn btn-primary" [disabled]="callForm.invalid">
                <i class="bi bi-plus-circle"></i> {{ isEdit ? 'Actualizar' : 'Crear' }} Llamada
              </button>
              <button type="button" class="btn btn-secondary" (click)="router.navigate(['/method-calls'])">
                <i class="bi bi-x-circle"></i> Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
