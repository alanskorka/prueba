<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <div class="d-flex justify-content-between align-items-center">
            <h3 class="mb-0">
              <i class="bi bi-code-slash"></i>
              Detalle de Variable Local
            </h3>
            <div class="btn-group">
              <a [routerLink]="['/local-vars', localVar?.id, 'edit']" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-pencil"></i> Editar
              </a>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteLocalVar()" [disabled]="loading">
                <i class="bi bi-trash"></i> Eliminar
              </button>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div *ngIf="loading" class="text-center my-4">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle"></i> {{ errorMessage }}
          </div>

          <div *ngIf="!loading && localVar" class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label fw-bold">Nombre:</label>
                <p class="form-control-plaintext">{{ localVar.name }}</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label fw-bold">Tipo de Datos:</label>
                <p class="form-control-plaintext">{{ localVar.type }}</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label fw-bold">Método:</label>
                <p class="form-control-plaintext">{{ getMethodName(localVar.methodId) }}</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label fw-bold">Tipo Concreto:</label>
                <p class="form-control-plaintext">{{ localVar.concreteTypeId || 'No especificado' }}</p>
              </div>
            </div>
            <div class="col-12">
              <div class="mb-3">
                <label class="form-label fw-bold">ID:</label>
                <p class="form-control-plaintext text-muted">{{ localVar.id }}</p>
              </div>
            </div>
          </div>

          <div *ngIf="!loading && !localVar && !errorMessage" class="text-center text-muted py-4">
            <i class="bi bi-question-circle fs-1"></i>
            <p class="mt-2">Variable local no encontrada</p>
          </div>

          <div class="mt-4">
            <a routerLink="/local-vars" class="btn btn-secondary">
              <i class="bi bi-arrow-left"></i> Volver a la Lista
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
